name: Build PhotoFest (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Check
        run: npm run check
      - name: Build installer + portable
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoFest-windows
          path: |
            dist/*.exe
      - name: Publish release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
